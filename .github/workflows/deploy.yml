name: Deploy

# Deploys main to Cloudflare Workers after CI succeeds, then smoke-tests the live API.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers edit permission) and
# CLOUDFLARE_ACCOUNT_ID, and the repository variable API_BASE_URL (e.g. https://deshapi.riadul.com).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:build
      - name: Deploy API Worker
        run: pnpm exec wrangler deploy --var VERSION:${{ github.event.workflow_run.head_sha || github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build Web Portal
        run: |
          npm --prefix web install
          npm --prefix web run build
      - name: Deploy Web Portal to portal.deshapi.riadul.com
        run: pnpm exec wrangler deploy --cwd web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: pnpm smoke
        env:
          BASE: ${{ vars.API_BASE_URL }}
