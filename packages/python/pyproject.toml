[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desh-api"
version = "1.0.0"
description = "Official Python client for Desh API (https://deshapi.riadul.com)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Desh API Contributors" }]
keywords = ["bangladesh", "desh-api", "bangla", "nid", "tax", "prayer-times", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://deshapi.riadul.com"
Documentation = "https://deshapi.riadul.com/docs"
Repository = "https://github.com/rdnasim/desh-api"
