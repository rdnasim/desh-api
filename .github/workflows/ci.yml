name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:check
      - run: pnpm data:build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec vitest run
      - run: pnpm exec tsx scripts/check-bundle-size.ts
